<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fafafa">
    <title>USD / VES</title>
    <!-- Favicon SVG en línea (0 peticiones extra) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='2' x2='12' y2='22'/><path d='M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'/></svg>">
    <style>
        /* Variables de diseño (Tema Claro por defecto) */
        :root {
            --bg-body: #fafafa;
            --bg-card: #ffffff;
            --bg-surface: #f4f4f5;
            --bg-surface-alt: rgba(244, 244, 245, 0.85);
            --bg-btn-num: #fafafa;
            --bg-btn-hover: #e4e4e7;
            --bg-pill-active: #ffffff;
            --border-main: rgba(228, 228, 231, 0.85);
            --border-subtle: rgba(228, 228, 231, 0.65);
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --text-muted: #a1a1aa;
            --accent-emerald: #059669;
            --accent-amber: #f59e0b;
            --accent-indigo: #4f46e5;
            --accent-violet: #7c3aed;
            --accent-rose: #e11d48;
            --bg-rose-soft: rgba(244, 63, 94, 0.1);
            --bg-rose-hover: rgba(244, 63, 94, 0.18);
            --shadow-card: 0 25px 50px -12px rgba(228, 228, 231, 0.7);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        /* Variables Tema Oscuro */
        html.dark {
            --bg-body: #09090b;
            --bg-card: #121215;
            --bg-surface: #1c1c21;
            --bg-surface-alt: rgba(28, 28, 33, 0.9);
            --bg-btn-num: rgba(28, 28, 33, 0.55);
            --bg-btn-hover: #27272e;
            --bg-pill-active: #27272e;
            --border-main: rgba(39, 39, 42, 0.85);
            --border-subtle: rgba(63, 63, 70, 0.45);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-emerald: #34d399;
            --accent-amber: #fbbf24;
            --accent-indigo: #818cf8;
            --accent-violet: #a78bfa;
            --accent-rose: #fb7185;
            --bg-rose-soft: rgba(244, 63, 94, 0.12);
            --bg-rose-hover: rgba(244, 63, 94, 0.22);
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            transition: background-color 0.25s ease, color 0.25s ease;
            user-select: none;
        }

        button {
            font-family: inherit;
            border: none;
            background: none;
            cursor: pointer;
            color: inherit;
            touch-action: manipulation;
            transition: transform 0.12s ease, background-color 0.18s ease, color 0.18s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        svg {
            display: block;
            flex-shrink: 0;
        }

        /* Contenedor Principal */
        .app-card {
            width: 100%;
            max-width: 26rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 1.75rem;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra Superior */
        .header {
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-main);
            position: relative;
        }

        .rate-selector {
            display: flex;
            background-color: var(--bg-surface);
            padding: 0.25rem;
            border-radius: 1rem;
            gap: 0.2rem;
        }

        .rate-btn {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.45rem 0.55rem;
            border-radius: 0.75rem;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: 0.03em;
            color: var(--text-secondary);
        }

        .rate-btn:hover {
            color: var(--text-primary);
        }

        .rate-btn.active-par {
            background-color: var(--bg-pill-active);
            color: var(--accent-amber);
            box-shadow: var(--shadow-sm);
        }

        .rate-btn.active-bcv {
            background-color: var(--bg-pill-active);
            color: var(--accent-emerald);
            box-shadow: var(--shadow-sm);
        }

        .rate-btn.active-eur-par {
            background-color: var(--bg-pill-active);
            color: var(--accent-violet);
            box-shadow: var(--shadow-sm);
        }

        .rate-btn.active-eur {
            background-color: var(--bg-pill-active);
            color: var(--accent-indigo);
            box-shadow: var(--shadow-sm);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .icon-btn {
            padding: 0.625rem;
            border-radius: 0.75rem;
            background-color: var(--bg-surface);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: var(--bg-btn-hover);
            color: var(--text-primary);
        }

        /* Indicador de Tasa Actual */
        .rate-bar {
            padding: 1.5rem 1.25rem 0.875rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-mono);
        }

        .status-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 9999px;
            background-color: #10b981;
        }

        .status-dot.offline {
            background-color: #f59e0b;
        }

        .rate-value-wrap {
            display: flex;
            align-items: baseline;
            gap: 0.35rem;
        }

        .rate-value {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .rate-currency {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Pantallas de Conversión */
        .converter-section {
            padding: 0.5rem 1.25rem 0.625rem;
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
            position: relative;
        }

        .currency-card {
            background-color: var(--bg-surface-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 1.25rem;
            padding: 1.15rem 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .status-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .status-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 9999px;
            background-color: #10b981;
        }

        .status-dot.offline {
            background-color: #f59e0b;
        }

        .rate-value-wrap {
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .rate-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .rate-currency {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Pantallas de Conversión */
        .converter-section {
            padding: 0.375rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .currency-card {
            background-color: var(--bg-surface-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 1.125rem;
            padding: 0.9rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.6rem;
            border-radius: 0.5rem;
            background-color: var(--bg-pill-active);
            box-shadow: var(--shadow-sm);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-usd {
            color: var(--accent-emerald);
        }

        .badge-ves {
            color: var(--accent-indigo);
        }

        .badge-eur {
            color: var(--accent-indigo);
        }

        .math-expr {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            height: 1rem;
            max-width: 11rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .alt-compare {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .amount-display {
            font-family: var(--font-mono);
            font-size: clamp(2rem, 8vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            text-align: right;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .amount-result {
            color: var(--accent-emerald);
        }

        .copy-btn {
            padding: 0.45rem;
            border-radius: 0.65rem;
            color: var(--text-muted);
        }

        .copy-btn:hover {
            color: var(--text-primary);
            background-color: var(--bg-btn-hover);
        }

        /* Botón Flotante de Intercambio */
        .swap-btn {
            align-self: center;
            margin: -0.95rem 0;
            z-index: 10;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            background-color: var(--bg-pill-active);
            border: 1px solid var(--border-main);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .swap-btn:hover {
            transform: scale(1.08);
        }

        .swap-btn:active {
            transform: scale(0.94);
        }

        .swap-icon {
            transition: transform 0.25s ease;
        }

        /* Teclado Numérico */
        .keypad {
            padding: 0.875rem 1.25rem 1.25rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.65rem;
        }

        .key {
            height: 3.4rem;
            border-radius: 1rem;
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-num {
            background-color: var(--bg-btn-num);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }

        .key-num:hover {
            background-color: var(--bg-surface);
        }

        .key-op {
            background-color: var(--bg-surface);
            color: var(--accent-emerald);
        }

        .key-op:hover {
            background-color: var(--bg-btn-hover);
        }

        .key-util {
            background-color: var(--bg-surface);
            color: var(--text-secondary);
        }

        .key-util:hover {
            background-color: var(--bg-btn-hover);
            color: var(--text-primary);
        }

        .key-clear {
            background-color: var(--bg-rose-soft);
            color: var(--accent-rose);
        }

        .key-clear:hover {
            background-color: var(--bg-rose-hover);
        }

        /* Modal de Configuración */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 50;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 18rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 1.5rem;
            padding: 1rem;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            animation: modalIn 0.16s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
            padding: 0 0.25rem;
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .format-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0.875rem;
            border-radius: 1rem;
            background-color: var(--bg-surface);
            border: 1.5px solid transparent;
            font-family: var(--font-mono);
            color: var(--text-primary);
        }

        .format-option:hover {
            background-color: var(--bg-btn-hover);
        }

        .format-option.active {
            border-color: var(--accent-emerald);
            background-color: var(--bg-pill-active);
        }

        .format-symbol {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 0.5rem;
            background-color: var(--bg-card);
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-emerald);
            box-shadow: var(--shadow-sm);
        }

        .format-sample {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .format-option.active .format-sample {
            color: var(--text-primary);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinning {
            animation: spin 0.7s linear infinite;
        }

        .text-amber { color: var(--accent-amber); }
        .text-emerald { color: var(--accent-emerald); }
        .text-indigo { color: var(--accent-indigo); }
        .text-violet { color: var(--accent-violet); }
    </style>
</head>
<body>

    <main class="app-card">
        <!-- Barra Superior -->
        <header class="header">
            <!-- Selector de Tasa: Dólar PAR/BCV y Euro PAR/BCV -->
            <div class="rate-selector">
                <button id="btn-paralelo" onclick="setRateType('paralelo')" aria-label="Dólar Paralelo" class="rate-btn active-par">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    <span>PAR</span>
                </button>
                <button id="btn-bcv" onclick="setRateType('bcv')" aria-label="Dólar BCV" class="rate-btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>
                    <span>BCV</span>
                </button>
                <button id="btn-eur-par" onclick="setRateType('eur_par')" aria-label="Euro Paralelo" class="rate-btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    <span>EUR</span>
                </button>
                <button id="btn-eur" onclick="setRateType('eur')" aria-label="Euro BCV" class="rate-btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>
                    <span>EUR</span>
                </button>
            </div>

            <!-- Botones de Sincronización, Configuración y Tema -->
            <div class="header-actions">
                <button id="btn-sync" onclick="fetchRates(true)" aria-label="Actualizar" class="icon-btn">
                    <svg id="icon-sync" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                </button>

                <button id="btn-settings" onclick="toggleSettingsModal(true)" aria-label="Configuración" class="icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>

                <button onclick="toggleTheme()" aria-label="Tema" class="icon-btn">
                    <svg id="icon-theme" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
            </div>
        </header>

        <!-- Display de Tasa Activa -->
        <div class="rate-bar">
            <div class="status-wrap">
                <span id="status-dot" class="status-dot"></span>
                <span id="rate-unit-label">1 USD =</span>
            </div>
            <div class="rate-value-wrap">
                <span id="current-rate-display" class="rate-value">0.00</span>
                <span class="rate-currency">VES</span>
            </div>
        </div>

        <!-- Pantallas de Conversión -->
        <section class="converter-section">
            <!-- Moneda Origen -->
            <div class="currency-card">
                <div class="card-top">
                    <div id="from-badge" class="badge badge-usd">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        <span>USD</span>
                    </div>
                </div>
                
                <div class="card-bottom">
                    <div id="from-amount" class="amount-display">0</div>
                    <button onclick="copyValue('from')" aria-label="Copiar" class="copy-btn">
                        <svg id="copy-icon-from" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                </div>
            </div>

            <!-- Botón Invertir Monedas -->
            <button onclick="swapDirection()" aria-label="Invertir" class="swap-btn">
                <svg id="swap-icon" class="swap-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
            </button>

            <!-- Moneda Destino -->
            <div class="currency-card">
                <div class="card-top">
                    <div id="to-badge" class="badge badge-ves">
                        <span style="font-weight:800;font-size:11px;">Bs</span>
                        <span>VES</span>
                    </div>

                    <!-- Comparativa Tasa Alternativa -->
                    <div class="alt-compare">
                        <span id="alt-rate-icon"></span>
                        <span id="alt-amount">0.00</span>
                    </div>
                </div>

                <div class="card-bottom">
                    <div id="to-amount" class="amount-display amount-result">0.00</div>
                    <button onclick="copyValue('to')" aria-label="Copiar" class="copy-btn">
                        <svg id="copy-icon-to" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Teclado Numérico -->
        <section class="keypad">
            <button onclick="calcDigit('7')" class="key key-num">7</button>
            <button onclick="calcDigit('8')" class="key key-num">8</button>
            <button onclick="calcDigit('9')" class="key key-num">9</button>

            <button onclick="calcDigit('4')" class="key key-num">4</button>
            <button onclick="calcDigit('5')" class="key key-num">5</button>
            <button onclick="calcDigit('6')" class="key key-num">6</button>

            <button onclick="calcDigit('1')" class="key key-num">1</button>
            <button onclick="calcDigit('2')" class="key key-num">2</button>
            <button onclick="calcDigit('3')" class="key key-num">3</button>

            <button id="btn-decimal" onclick="calcDecimal()" class="key key-num">.</button>
            <button onclick="calcDigit('0')" class="key key-num">0</button>
            <button onclick="calcDigit('00')" class="key key-num" style="font-size:1.1rem;">00</button>

            <button onclick="calcClear()" aria-label="Limpiar" class="key key-clear" style="grid-column: span 2;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            </button>
            <button onclick="calcBackspace()" aria-label="Borrar" class="key key-util">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
            </button>
        </section>

    </main>

    <!-- Ventana Modal de Formato Decimal -->
    <div id="settings-modal" class="modal-backdrop" onclick="if(event.target===this) toggleSettingsModal(false)">
        <div class="modal-box" role="dialog" aria-modal="true" aria-label="Formato decimal">
            <div class="modal-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <button onclick="toggleSettingsModal(false)" aria-label="Cerrar" class="copy-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-options">
                <button id="opt-dot" onclick="setDecimalSeparator('.')" class="format-option active">
                    <span class="format-symbol">.</span>
                    <span class="format-sample">1,234.56</span>
                    <svg id="check-dot" class="text-emerald" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
                <button id="opt-comma" onclick="setDecimalSeparator(',')" class="format-option">
                    <span class="format-symbol">,</span>
                    <span class="format-sample">1.234,56</span>
                    <svg id="check-comma" class="text-emerald" style="visibility:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* Iconos SVG reutilizables en línea */
        const ICONS = {
            moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
            sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
            bolt: '<svg class="text-amber" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
            boltViolet: '<svg class="text-violet" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
            bank: '<svg class="text-emerald" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>',
            bankIndigo: '<svg class="text-indigo" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>',
            usd: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>USD</span>',
            eur: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg><span>EUR</span>',
            ves: '<span style="font-weight:800;font-size:11px;">Bs</span><span>VES</span>',
            copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
            check: '<polyline points="20 6 9 17 4 12" stroke="#10b981" stroke-width="2.5"/>'
        };

        const CACHE_KEY = 've_rates_cache_v3';
        const CACHE_TTL = 15 * 60 * 1000; // 15 minutos de caché inteligente

        /* Estado de la App */
        const state = {
            rates: { bcv: 46.50, paralelo: 54.20, eur: 50.40, eur_par: 58.60 },
            updatedAt: 0,
            activeType: 'paralelo',
            direction: 'FOREIGN_TO_VES',
            currentInput: '0',
            decimalSeparator: '.'
        };

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initDecimalFormat();
            const hasFreshCache = loadSavedRates();
            updateUI();
            // Solo consulta la red al iniciar si la caché tiene más de 15 min
            if (!hasFreshCache) {
                fetchRates(false);
            }
            setupKeyboardSupport();
        });

        /* Gestión de Tema y Formato Decimal */
        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'dark' : prefersDark;
            document.documentElement.classList.toggle('dark', isDark);
            document.getElementById('icon-theme').innerHTML = isDark ? ICONS.sun : ICONS.moon;
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', isDark ? '#09090b' : '#fafafa');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('icon-theme').innerHTML = isDark ? ICONS.sun : ICONS.moon;
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', isDark ? '#09090b' : '#fafafa');
        }

        function initDecimalFormat() {
            const savedSep = localStorage.getItem('ve_decimal_sep');
            if (savedSep === ',' || savedSep === '.') {
                state.decimalSeparator = savedSep;
            }
            syncModalOptions();
        }

        function toggleSettingsModal(open) {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('open', open);
        }

        function setDecimalSeparator(sep) {
            state.decimalSeparator = sep;
            localStorage.setItem('ve_decimal_sep', sep);
            syncModalOptions();
            updateUI();
            toggleSettingsModal(false);
        }

        function syncModalOptions() {
            const isComma = state.decimalSeparator === ',';
            document.getElementById('opt-dot').classList.toggle('active', !isComma);
            document.getElementById('opt-comma').classList.toggle('active', isComma);
            document.getElementById('check-dot').style.visibility = !isComma ? 'visible' : 'hidden';
            document.getElementById('check-comma').style.visibility = isComma ? 'visible' : 'hidden';
        }

        /* Caché Local Inteligente */
        function loadSavedRates() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                if (parsed && parsed.rates && parsed.rates.bcv && parsed.rates.paralelo && parsed.rates.eur && parsed.rates.eur_par) {
                    state.rates = parsed.rates;
                    state.updatedAt = parsed.updatedAt || 0;
                    return (Date.now() - state.updatedAt) < CACHE_TTL;
                }
            } catch (e) {
                // Ignorar error de almacenamiento
            }
            return false;
        }

        function saveRates() {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    rates: state.rates,
                    updatedAt: state.updatedAt
                }));
            } catch (e) {
                // Ignorar error de almacenamiento
            }
        }

        /* Consulta API con Timeout (5s) para conexiones lentas */
        async function fetchRates(force = false) {
            const icon = document.getElementById('icon-sync');
            const btn = document.getElementById('btn-sync');
            const dot = document.getElementById('status-dot');

            icon.classList.add('spinning');
            btn.disabled = true;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            const fetchOpts = {
                signal: controller.signal,
                cache: force ? 'no-cache' : 'default'
            };

            try {
                const [usdRes, eurRes] = await Promise.all([
                    fetch('https://ve.dolarapi.com/v1/dolares', fetchOpts),
                    fetch('https://ve.dolarapi.com/v1/euros', fetchOpts).catch(() => null)
                ]);
                clearTimeout(timeoutId);

                if (!usdRes.ok) throw new Error('HTTP ' + usdRes.status);
                const usdData = await usdRes.json();

                if (Array.isArray(usdData)) {
                    const oficial = usdData.find(item => item.fuente === 'oficial');
                    const paralelo = usdData.find(item => item.fuente === 'paralelo');

                    if (oficial && oficial.promedio > 0) state.rates.bcv = Number(oficial.promedio);
                    if (paralelo && paralelo.promedio > 0) state.rates.paralelo = Number(paralelo.promedio);
                }

                if (eurRes && eurRes.ok) {
                    const eurData = await eurRes.json();
                    if (Array.isArray(eurData)) {
                        const eurOficial = eurData.find(item => item.fuente === 'oficial');
                        const eurParalelo = eurData.find(item => item.fuente === 'paralelo');
                        if (eurOficial && eurOficial.promedio > 0) state.rates.eur = Number(eurOficial.promedio);
                        if (eurParalelo && eurParalelo.promedio > 0) state.rates.eur_par = Number(eurParalelo.promedio);
                    }
                }

                state.updatedAt = Date.now();
                saveRates();
                dot.classList.remove('offline');
            } catch (error) {
                clearTimeout(timeoutId);
                dot.classList.add('offline');
            } finally {
                icon.classList.remove('spinning');
                btn.disabled = false;
                updateUI();
            }
        }

        /* Selector de Tasa y Dirección */
        function setRateType(type) {
            state.activeType = type;
            document.getElementById('btn-paralelo').classList.toggle('active-par', type === 'paralelo');
            document.getElementById('btn-bcv').classList.toggle('active-bcv', type === 'bcv');
            document.getElementById('btn-eur-par').classList.toggle('active-eur-par', type === 'eur_par');
            document.getElementById('btn-eur').classList.toggle('active-eur', type === 'eur');
            updateUI();
        }

        function swapDirection() {
            state.direction = state.direction === 'FOREIGN_TO_VES' ? 'VES_TO_FOREIGN' : 'FOREIGN_TO_VES';
            const icon = document.getElementById('swap-icon');
            icon.style.transform = state.direction === 'VES_TO_FOREIGN' ? 'rotate(180deg)' : 'rotate(0deg)';
            updateUI();
        }

        /* Lógica de Entrada Numérica */
        function calcDigit(digit) {
            if (state.currentInput === '0') {
                state.currentInput = digit === '00' ? '0' : digit;
            } else if (state.currentInput.length < 13) {
                state.currentInput += digit;
            }
            updateUI();
        }

        function calcDecimal() {
            if (!state.currentInput.includes('.')) {
                state.currentInput += '.';
            }
            updateUI();
        }

        function calcClear() {
            state.currentInput = '0';
            updateUI();
        }

        function calcBackspace() {
            if (state.currentInput.length > 1) {
                state.currentInput = state.currentInput.slice(0, -1);
                if (state.currentInput === '-') state.currentInput = '0';
            } else {
                state.currentInput = '0';
            }
            updateUI();
        }

        /* Renderizado */
        function formatNumber(num, decimals = 2) {
            if (isNaN(num)) return state.decimalSeparator === ',' ? '0,00' : '0.00';
            const fixed = Math.abs(num).toFixed(decimals);
            const [intPart, decPart] = fixed.split('.');
            const thouSep = state.decimalSeparator === ',' ? '.' : ',';
            const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, thouSep);
            const sign = num < 0 ? '-' : '';
            return decPart ? `${sign}${formattedInt}${state.decimalSeparator}${decPart}` : `${sign}${formattedInt}`;
        }

        function updateUI() {
            const isEur = state.activeType === 'eur' || state.activeType === 'eur_par';
            const activeRate = state.rates[state.activeType];

            let altType = 'bcv';
            if (state.activeType === 'bcv') altType = 'paralelo';
            else if (state.activeType === 'eur_par') altType = 'eur';
            else if (state.activeType === 'eur') altType = 'eur_par';

            const altRate = state.rates[altType];

            document.getElementById('rate-unit-label').textContent = isEur ? '1 EUR =' : '1 USD =';
            document.getElementById('current-rate-display').textContent = formatNumber(activeRate, 2);
            document.getElementById('btn-decimal').textContent = state.decimalSeparator;

            const fromBadge = document.getElementById('from-badge');
            const toBadge = document.getElementById('to-badge');

            if (state.direction === 'FOREIGN_TO_VES') {
                fromBadge.className = isEur ? 'badge badge-eur' : 'badge badge-usd';
                fromBadge.innerHTML = isEur ? ICONS.eur : ICONS.usd;
                toBadge.className = 'badge badge-ves';
                toBadge.innerHTML = ICONS.ves;
            } else {
                fromBadge.className = 'badge badge-ves';
                fromBadge.innerHTML = ICONS.ves;
                toBadge.className = isEur ? 'badge badge-eur' : 'badge badge-usd';
                toBadge.innerHTML = isEur ? ICONS.eur : ICONS.usd;
            }

            const rawVal = parseFloat(state.currentInput) || 0;
            const parts = state.currentInput.split('.');
            const thouSep = state.decimalSeparator === ',' ? '.' : ',';
            const formattedInt = (parts[0] || '0').replace(/\B(?=(\d{3})+(?!\d))/g, thouSep);
            document.getElementById('from-amount').textContent =
                parts.length > 1 ? `${formattedInt}${state.decimalSeparator}${parts[1]}` : formattedInt;

            let converted = 0;
            let altConverted = 0;

            if (state.direction === 'FOREIGN_TO_VES') {
                converted = rawVal * activeRate;
                altConverted = rawVal * altRate;
            } else {
                converted = activeRate > 0 ? rawVal / activeRate : 0;
                altConverted = altRate > 0 ? rawVal / altRate : 0;
            }

            document.getElementById('to-amount').textContent = formatNumber(converted, 2);
            const altIcons = {
                paralelo: ICONS.bolt,
                bcv: ICONS.bank,
                eur_par: ICONS.boltViolet,
                eur: ICONS.bankIndigo
            };
            document.getElementById('alt-rate-icon').innerHTML = altIcons[altType];
            document.getElementById('alt-amount').textContent = formatNumber(altConverted, 2);
        }

        /* Copiar al Portapapeles */
        function copyValue(target) {
            const thouRegex = state.decimalSeparator === ',' ? /\./g : /,/g;
            const textToCopy = document.getElementById(`${target}-amount`).textContent.replace(thouRegex, '');
            const temp = document.createElement('input');
            temp.value = textToCopy;
            document.body.appendChild(temp);
            temp.select();
            try {
                document.execCommand('copy');
                const icon = document.getElementById(`copy-icon-${target}`);
                icon.innerHTML = ICONS.check;
                setTimeout(() => {
                    icon.innerHTML = ICONS.copy;
                }, 1200);
            } catch (e) {
                // Ignorar error de copiado
            }
            document.body.removeChild(temp);
        }

        /* Teclado Físico */
        function setupKeyboardSupport() {
            document.addEventListener('keydown', (e) => {
                const modalOpen = document.getElementById('settings-modal').classList.contains('open');
                if (modalOpen) {
                    if (e.key === 'Escape') toggleSettingsModal(false);
                    return;
                }
                if (e.key >= '0' && e.key <= '9') {
                    calcDigit(e.key);
                } else if (e.key === '.' || e.key === ',') {
                    calcDecimal();
                } else if (e.key === 'Backspace') {
                    calcBackspace();
                } else if (e.key === 'Escape' || e.key === 'Delete') {
                    calcClear();
                }
            });
        }
    </script>
</body>
